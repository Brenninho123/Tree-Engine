name: Build Tree Engine

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Haxe
      uses: krdlab/setup-haxe@v1
      with:
        haxe-version: 4.3.7

    - name: Install Dependencies
      run: |
        haxelib install hmm
        haxelib run hmm setup
        haxelib run hmm install
        haxelib run lime setup

    - name: Compile Project
      run: haxelib run lime build windows -release

    - name: Package Artifact
      shell: pwsh
      run: |
        Compress-Archive -Path export/windows/bin/* -DestinationPath "./TreeEngine (Windows).zip"

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TreeEngine (Windows)
        path: TreeEngine (Windows).zip

  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Haxe
      uses: krdlab/setup-haxe@v1
      with:
        haxe-version: 4.3.7

    - name: Install Dependencies
      run: |
        haxelib install hmm
        haxelib run hmm setup
        haxelib run hmm install

    - name: Configure Lime Android Paths
      run: |
        haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
        haxelib run lime config ANDROID_NDK "$ANDROID_HOME/ndk-bundle"
        haxelib run lime config JAVA_HOME "$JAVA_HOME"

    - name: Compile Project
      run: haxelib run lime build android -release

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TreeEngine (Android)
        path: export/android/bin/app/build/outputs/apk/release/*.apk
